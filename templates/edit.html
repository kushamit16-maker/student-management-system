<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        .box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>✏️ Edit Student</h1>

    <form method="POST">

        <input
            type="text"
            name="name"
            value="{{ student[1] }}"
            placeholder="Student Name"
            required
        >

        <input
            type="text"
            name="roll_no"
            value="{{ student[2] }}"
            placeholder="Roll Number"
            required
        >

        <input
            type="email"
            name="email"
            value="{{ student[3] }}"
            placeholder="Email"
        >

        <input
            type="text"
            name="course"
            value="{{ student[4] }}"
            placeholder="Course"
        >

        <input
            type="number"
            name="attendance"
            value="{{ student[5] }}"
            placeholder="Attendance"
            step="0.1"
        >

        <input
            type="number"
            name="marks"
            value="{{ student[6] }}"
            placeholder="Marks"
            step="0.1"
        >

        <button type="submit">Update Student</button>

    </form>

    <a href="/" class="back">⬅ Back to Dashboard</a>

</div>

</body>
</html>
