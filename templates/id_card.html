<!DOCTYPE html>
<html>
<head>
    <title>Student ID Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        .card {
            width: 350px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            color: #2563eb;
        }

        .info {
            text-align: left;
            margin-top: 20px;
        }

        .info p {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>🎓 Student ID Card</h1>

    <div class="info">

        <p>
            <strong>Name:</strong>
            {{ student[1] }}
        </p>

        <p>
            <strong>Roll Number:</strong>
            {{ student[2] }}
        </p>

        <p>
            <strong>Email:</strong>
            {{ student[3] }}
        </p>

        <p>
            <strong>Course:</strong>
            {{ student[4] }}
        </p>

        <p>
            <strong>Attendance:</strong>
            {{ student[5] }}%
        </p>

        <p>
            <strong>Marks:</strong>
            {{ student[6] }}
        </p>

    </div>

    <a href="/" class="back">⬅ Back to Dashboard</a>

</div>

</body>
</html>
